- name: Initialize CodeQL
  uses: github/codeql-action/init@v3
  with:
    languages: swift
    build-mode: manual  # 1. Force manual build mode

# 2. Remove or comment out 'github/codeql-action/autobuild@v3'

# 3. Add your explicit build step:
- name: Build Swift Code
  run: |
    # For Xcode Projects/Workspaces:
    xcodebuild -workspace YourProject.xcworkspace -scheme YourAppScheme -sdk iphonesimulator clean build
    
    # OR for Swift Package Manager (SPM):
    # swift build
