<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Synapse Core System Architecture</title>
  <desc id="arch-desc">Layered architecture diagram from Compose UI down to QUIC transport.</desc>

  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="1200" height="420" rx="20" fill="url(#arch-bg)"/>
  <rect width="1198" height="418" x="1" y="1" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Header Section -->
  <g transform="translate(60, 32)">
    <rect width="190" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="95" y="17" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">SYSTEM ARCHITECTURE</text>
    <text x="210" y="19" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Native Backend Engine &amp; Control Plane</text>
  </g>

  <!-- Horizontal Layer Cards (Spacious, Non-Overlapping Layout) -->
  <g transform="translate(60, 76)">

    <!-- Layer 1: Client Layer (y=0, height=52) -->
    <g transform="translate(0, 0)">
      <rect width="1080" height="52" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="32" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="700">CLIENT LAYER</text>
      
      <g transform="translate(180, 11)">
        <rect width="180" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="90" y="20" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Compose Desktop (PC)</text>
      </g>
      
      <g transform="translate(376, 11)">
        <rect width="190" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="95" y="20" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Compose Android (Mobile)</text>
      </g>
      
      <g transform="translate(582, 11)">
        <rect width="170" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="85" y="20" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Web Dashboard / CLI</text>
      </g>

      <text x="1055" y="32" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="end">HTTP / WS IPC</text>
    </g>

    <!-- Layer 2: Local Control Plane (y=72, height=54, Gap=20) -->
    <g transform="translate(0, 72)">
      <rect width="1080" height="54" rx="10" fill="#0E2238" stroke="#0284C7" stroke-width="1.2"/>
      <text x="24" y="33" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="700">CONTROL PLANE</text>
      <text x="180" y="33" fill="#BAE6FD" font-family="ui-monospace, monospace" font-size="11.5">
        Axum Embedded Server (127.0.0.1:9090)  •  /api/v1/system  •  /api/v1/folders  •  /api/v1/conflicts  •  WS /api/v1/events
      </text>
    </g>

    <!-- Layer 3: Core Engines (y=146, height=76, Gap=20) -->
    <g transform="translate(0, 146)">
      <!-- Col 1: Storage & Chunker -->
      <g transform="translate(0, 0)">
        <rect width="346" height="76" rx="10" fill="#0C1B2A" stroke="#1E3A5F" stroke-width="1.2"/>
        <text x="18" y="30" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Content Storage &amp; CAS</text>
        <text x="18" y="54" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">FastCDC (64K-2M) • BLAKE3 • SQLite WAL</text>
      </g>

      <!-- Col 2: Merkle DAG (Gap=20) -->
      <g transform="translate(366, 0)">
        <rect width="348" height="76" rx="10" fill="#1C132E" stroke="#6B21A8" stroke-width="1.2"/>
        <text x="18" y="30" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Merkle Revision DAG</text>
        <text x="18" y="54" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">Causality Graph • BFS LCA • 2-Parent Merge</text>
      </g>

      <!-- Col 3: Conflict Engine (Gap=20) -->
      <g transform="translate(734, 0)">
        <rect width="346" height="76" rx="10" fill="#062820" stroke="#065F46" stroke-width="1.2"/>
        <text x="18" y="30" fill="#34D399" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Multi-Strategy Conflict Pipeline</text>
        <text x="18" y="54" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">Tier 1: diff3 • Tier 2: Quarantine • Tier 3: UI</text>
      </g>
    </g>

    <!-- Layer 4: Networking & Transport (y=244, height=54, Gap=22) -->
    <g transform="translate(0, 244)">
      <rect width="1080" height="54" rx="10" fill="#1A1226" stroke="#7C3AED" stroke-width="1.2"/>
      <text x="24" y="33" fill="#C084FC" font-family="ui-monospace, monospace" font-size="12" font-weight="700">P2P TRANSPORT</text>
      <text x="180" y="33" fill="#E9D5FF" font-family="ui-monospace, monospace" font-size="11.5">
        Quinn QUIC Transport (UDP :9190)  •  TLS 1.3  •  Ed25519 Keys  •  Local Discovery Broadcast (UDP :21027)
      </text>
    </g>

  </g>
</svg>
