<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Synapse Core - Decentralized Synchronization Engine</title>
  <desc id="hero-desc">P2P continuous file synchronization with zero-pollution virtual quarantine and 3-way semantic merging.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="24" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid-pattern)"/>
  <rect width="1198" height="358" x="1" y="1" rx="23" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Left: Project Identity & Positioning -->
  <g id="identity" transform="translate(60, 48)">
    <!-- Eyebrow Badge -->
    <g transform="translate(0, 0)">
      <rect width="360" height="28" rx="14" fill="#0E2238" stroke="#0284C7" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#00E5FF"/>
      <text x="26" y="18" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">DECENTRALIZED P2P FILE ENGINE</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="80" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Synapse Core</text>

    <!-- Value Statement -->
    <text x="0" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      <tspan x="0" dy="0">High-performance continuous sync with zero-pollution virtual quarantine,</tspan>
      <tspan x="0" dy="26">true 3-way semantic merging, and unified single-binary architecture.</tspan>
    </text>

    <!-- Platform Badges -->
    <g transform="translate(0, 195)">
      <!-- Linux -->
      <g transform="translate(0, 0)">
        <rect width="105" height="32" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="52" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Linux x86/arm</text>
      </g>
      <!-- Android -->
      <g transform="translate(115, 0)">
        <rect width="155" height="32" rx="8" fill="#132E27" stroke="#059669" stroke-width="1"/>
        <text x="77" y="20" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Android libsynapse.so</text>
      </g>
      <!-- macOS -->
      <g transform="translate(280, 0)">
        <rect width="90" height="32" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="45" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">macOS</text>
      </g>
      <!-- Windows -->
      <g transform="translate(380, 0)">
        <rect width="95" height="32" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="47" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Windows</text>
      </g>
    </g>

    <!-- Metric Pills -->
    <g transform="translate(0, 240)">
      <text x="0" y="16" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500">
        <tspan fill="#38BDF8">FastCDC</tspan> 64KB–2MB  <tspan fill="#475569">|</tspan>  <tspan fill="#34D399">BLAKE3</tspan> ~7 GB/s  <tspan fill="#475569">|</tspan>  <tspan fill="#A78BFA">Quinn QUIC</tspan>  <tspan fill="#475569">|</tspan>  <tspan fill="#F59E0B">7.5 MB Stripped</tspan>
      </text>
    </g>
  </g>

  <!-- Right: Architecture Proof Board -->
  <g id="proof-board" transform="translate(680, 36)">
    <!-- Terminal / Inspection Card -->
    <rect width="460" height="288" rx="16" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <rect width="460" height="36" rx="16" fill="#0F172A"/>
    <path d="M 0 20 L 0 36 L 460 36 L 460 20 Z" fill="#0F172A"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="52" cy="18" r="5" fill="#10B981" opacity="0.8"/>
    <text x="230" y="22" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" text-anchor="middle">synapse-core :: engine-state</text>

    <!-- Merkle DAG Mini Visualization inside Card -->
    <g transform="translate(30, 52)">
      <!-- Base Revision R0 -->
      <g transform="translate(180, 10)">
        <circle cx="20" cy="15" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
        <text x="20" y="19" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">R0</text>
      </g>
      
      <!-- Edges down -->
      <line x1="188" y1="38" x2="90" y2="70" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="212" y1="38" x2="310" y2="70" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Local R1 -->
      <g transform="translate(70, 70)">
        <circle cx="20" cy="15" r="14" fill="#0C283B" stroke="#0284C7" stroke-width="1.5"/>
        <text x="20" y="19" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">R1</text>
        <text x="20" y="42" fill="#64748B" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Local (PC)</text>
      </g>

      <!-- Remote R2 -->
      <g transform="translate(290, 70)">
        <circle cx="20" cy="15" r="14" fill="#063327" stroke="#059669" stroke-width="1.5"/>
        <text x="20" y="19" fill="#34D399" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">R2</text>
        <text x="20" y="42" fill="#64748B" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Remote (Phone)</text>
      </g>

      <!-- Merge Edges down -->
      <line x1="90" y1="100" x2="188" y2="130" stroke="#0284C7" stroke-width="1.5"/>
      <line x1="310" y1="100" x2="212" y2="130" stroke="#059669" stroke-width="1.5"/>

      <!-- Merged Commit R3 -->
      <g transform="translate(180, 125)">
        <circle cx="20" cy="15" r="15" fill="#2E1065" stroke="#A855F7" stroke-width="2"/>
        <text x="20" y="19" fill="#D8B4FE" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">R3</text>
        <text x="20" y="44" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Auto-Merged (2-parent)</text>
      </g>
    </g>

    <!-- Terminal Status Lines -->
    <g transform="translate(24, 222)">
      <rect width="412" height="52" rx="8" fill="#020617" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="20" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10.5">
        <tspan fill="#10B981">✓</tspan> LCA Traversal: <tspan fill="#E2E8F0">Resolved at R0</tspan> (diff3: Clean)
      </text>
      <text x="12" y="38" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">
        <tspan fill="#10B981">✓</tspan> Virtual Quarantine: <tspan fill="#E2E8F0">0 .sync-conflict files created</tspan>
      </text>
    </g>
  </g>
</svg>
