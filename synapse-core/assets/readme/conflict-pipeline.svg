<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Synapse Core Multi-Strategy Conflict Pipeline</title>
  <desc id="pipeline-desc">Automated 3-way semantic merging, virtual quarantine, and interactive visual merge tool.</desc>

  <defs>
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="tier1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="tier2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="tier3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#pipe-bg)"/>
  <rect width="1198" height="378" x="1" y="1" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Section Header inside SVG -->
  <g transform="translate(60, 36)">
    <rect width="210" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="105" y="16" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">RESOLUTION PIPELINE</text>
    <text x="225" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Multi-Strategy Conflict Engine</text>
  </g>

  <!-- Flow Columns (Tier 1, Tier 2, Tier 3) -->
  <g transform="translate(60, 84)">
    <!-- TIER 1 CARD -->
    <g transform="translate(0, 0)">
      <rect width="340" height="255" rx="14" fill="#0C1919" stroke="#065F46" stroke-width="1.5"/>
      <rect width="70" height="22" x="16" y="16" rx="6" fill="#064E3B"/>
      <text x="51" y="31" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">TIER 1</text>
      
      <text x="16" y="66" fill="#F0FDF4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Automated 3-Way Merge</text>
      <text x="16" y="90" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Plain text, Markdown, CSV, Code</text>

      <path d="M 16 106 L 324 106" stroke="#064E3B" stroke-width="1"/>

      <text x="16" y="130" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">
        <tspan x="16" dy="0">• Line-level diff3 across Base, Local &amp; Remote</tspan>
        <tspan x="16" dy="22">• Non-overlapping edits merged cleanly</tspan>
        <tspan x="16" dy="22">• Creates 2-parent merge revision node</tspan>
        <tspan x="16" dy="22">• Writes atomically to disk with zero prompts</tspan>
      </text>

      <!-- Outcome Badge -->
      <g transform="translate(16, 212)">
        <rect width="308" height="28" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1"/>
        <text x="154" y="18" fill="#A7F3D0" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">Outcome: 100% Automatic Resolution</text>
      </g>
    </g>

    <!-- TIER 2 CARD -->
    <g transform="translate(370, 0)">
      <rect width="340" height="255" rx="14" fill="#18130B" stroke="#78350F" stroke-width="1.5"/>
      <rect width="70" height="22" x="16" y="16" rx="6" fill="#451A03"/>
      <text x="51" y="31" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">TIER 2</text>

      <text x="16" y="66" fill="#FFFBEB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Virtual Quarantine</text>
      <text x="16" y="90" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Overlapping edits or Binary files</text>

      <path d="M 16 106 L 324 106" stroke="#451A03" stroke-width="1"/>

      <text x="16" y="130" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">
        <tspan x="16" dy="0">• Zero Filesystem Pollution (.sync-conflict)</tspan>
        <tspan x="16" dy="22">• Local disk file remains 100% untouched</tspan>
        <tspan x="16" dy="22">• Quarantined in .synapse/quarantine/</tspan>
        <tspan x="16" dy="22">• Emits WebSocket CONFLICT_DETECTED</tspan>
      </text>

      <!-- Outcome Badge -->
      <g transform="translate(16, 212)">
        <rect width="308" height="28" rx="6" fill="#451A03" stroke="#D97706" stroke-width="1"/>
        <text x="154" y="18" fill="#FDE68A" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">Outcome: Staged Staging &amp; UI Alert</text>
      </g>
    </g>

    <!-- TIER 3 CARD -->
    <g transform="translate(740, 0)">
      <rect width="340" height="255" rx="14" fill="#150E24" stroke="#5B21B6" stroke-width="1.5"/>
      <rect width="70" height="22" x="16" y="16" rx="6" fill="#3B0764"/>
      <text x="51" y="31" fill="#C084FC" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">TIER 3</text>

      <text x="16" y="66" fill="#FAF5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Interactive UI Merge</text>
      <text x="16" y="90" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Compose Multiplatform Side-by-Side</text>

      <path d="M 16 106 L 324 106" stroke="#3B0764" stroke-width="1"/>

      <text x="16" y="130" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">
        <tspan x="16" dy="0">• Visual 3-way diff view (Base/Local/Remote)</tspan>
        <tspan x="16" dy="22">• ACCEPT_LOCAL: Discard quarantine staging</tspan>
        <tspan x="16" dy="22">• ACCEPT_REMOTE: Overwrite disk copy</tspan>
        <tspan x="16" dy="22">• CUSTOM_MERGE: User editor text to disk</tspan>
      </text>

      <!-- Outcome Badge -->
      <g transform="translate(16, 212)">
        <rect width="308" height="28" rx="6" fill="#3B0764" stroke="#8B5CF6" stroke-width="1"/>
        <text x="154" y="18" fill="#DDD6FE" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">Outcome: Complete User Decision Control</text>
      </g>
    </g>
  </g>
</svg>
