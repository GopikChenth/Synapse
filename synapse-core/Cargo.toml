[package]
name = "synapse-core"
version = "1.0.0"
edition = "2021"
authors = ["Synapse Team"]
description = "Decentralized File Synchronization & Conflict Resolution Engine"

[[bin]]
name = "synapse-core"
path = "src/main.rs"

[lib]
name = "synapse_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
# Async Runtime
tokio = { version = "1.40", features = ["full", "test-util"] }
futures = "0.3"
futures-util = "0.3"

# Web Server & WebSockets
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Storage & Database (bundled SQLite for 100% self-contained cross-platform binary)
rusqlite = { version = "0.32", features = ["bundled"] }

# Hashing & Chunking
blake3 = "1.5"
fastcdc = "5.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Text Diffing & Semantic Merging
similar = { version = "2.6", features = ["text"] }

# CLI Arguments & Config
clap = { version = "4.5", features = ["derive", "env"] }

# Filesystem Watching & Metadata
notify = "6.1"
filetime = "0.2"

# Cryptography & Identities
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
ring = "0.17"

# Networking & QUIC Transport
socket2 = "0.6"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
