name: Build & Release Synapse Core Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: synapse-core
            asset_name: synapse-core-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: synapse-core.exe
            asset_name: synapse-core-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: synapse-core
            asset_name: synapse-core-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin synapse-core

      - name: Rename and stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  build-android:
    name: Build Android NDK (libsynapse.so)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android arm64-v8a
        run: cargo ndk -t arm64-v8a build --release --bin synapse-core

      - name: Build Android x86_64
        run: cargo ndk -t x86_64 build --release --bin synapse-core

      - name: Package Android Artifacts
        run: |
          mkdir -p dist/android/arm64-v8a dist/android/x86_64
          cp target/aarch64-linux-android/release/synapse-core dist/android/arm64-v8a/libsynapse.so
          cp target/x86_64-linux-android/release/synapse-core dist/android/x86_64/libsynapse.so

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synapse-android-jniLibs
          path: dist/android/
